<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stocky’s Detailing Work</title>

<style>
  body { margin:0; background:#111; color:#fff; font-family:Arial; }

  h1 {
    font-family: 'Bank Gothic', Arial, sans-serif;
    text-align:center;
    color:white;
    margin:20px 0;
    font-size:32px;
    letter-spacing:2px;
  }

  .container { 
    max-width:900px; 
    margin:20px auto; 
    padding:0 10px;
  }

  /* COMPARISON SLIDER */
  .compare-wrapper { 
    position:relative; 
    width:100%; 
    overflow:hidden; 
    border-radius:10px; 
    height:450px; 
    touch-action:none; /* prevents zooming */
  }

  @media (max-width: 600px) {
    .compare-wrapper { height:300px; }
  }

  .compare-wrapper img { 
    width:100%; 
    height:100%; 
    object-fit:cover; 
    display:block; 
    pointer-events:none;
  }

  .after-img {
    position:absolute;
    top:0;
    left:0;
    width:50%;
    height:100%;
    overflow:hidden;
  }

  .after-img img {
    width:100%;
    height:100%;
    object-fit:cover;
  }

  /* METALLIC DRAG KNOB */
  .slider {
    position:absolute;
    top:50%;
    left:50%;
    width:50px;
    height:50px;
    border-radius:50%;
    cursor:ew-resize;
    transform:translate(-50%, -50%);
    background: radial-gradient(circle at 30% 30%, #ffffff, #d9d9d9, #b3b3b3, #8c8c8c);
    box-shadow:
      inset 0 0 8px rgba(255,255,255,0.8),
      inset 0 0 20px rgba(0,0,0,0.4),
      0 0 15px rgba(0,0,0,0.6);
    border:2px solid #e6e6e6;
    z-index:5;
    touch-action:none; /* stops zoom */
  }

  @media (max-width: 600px) {
    .slider { width:35px; height:35px; }
  }

  /* LABELS */
  .label {
    position:absolute;
    bottom:10px;
    padding:6px 12px;
    background:white;
    color:black;
    font-weight:bold;
    border-radius:5px;
    font-size:14px;
    z-index:4;
  }
  .label-before { left:10px; }
  .label-after { right:10px; }

  /* SET TITLES */
  .set-title {
    text-align:center;
    font-family:'Bank Gothic', Arial, sans-serif;
    color:white;
    font-size:22px;
    margin-bottom:10px;
    letter-spacing:1px;
  }

  .set { display:none; }

  /* BOTTOM ARROWS */
  .arrow-bar {
    text-align:center;
    margin-top:15px;
  }

  .arrow-btn {
    font-size:32px;
    color:white;
    cursor:pointer;
    padding:10px 20px;
    user-select:none;
  }
</style>
</head>

<body>

<h1>Stocky's Detailing Work</h1>

<div class="container">

  <!-- YOUR 12 SETS (unchanged) -->
  <!-- I will not rewrite them here because your message already contains them perfectly -->
  <!-- Keep all your <div class="set" id="setX"> blocks exactly as they are -->

  <!-- BOTTOM ARROWS -->
  <div class="arrow-bar">
    <span class="arrow-btn" onclick="prevSet()">&#10094;</span>
    <span class="arrow-btn" onclick="nextSet()">&#10095;</span>
  </div>

</div>

<script>
let currentSet = 1;

function showSet(n) {
  document.querySelectorAll('.set').forEach(s => s.style.display = 'none');
  document.getElementById('set'+n).style.display = 'block';
}
showSet(1);

function nextSet() {
  currentSet = currentSet === 12 ? 1 : currentSet + 1;
  showSet(currentSet);
}

function prevSet() {
  currentSet = currentSet === 1 ? 12 : currentSet - 1;
  showSet(currentSet);
}

/* DRAG KNOB LOGIC — FIXED FOR GOOGLE SITES */
document.querySelectorAll('.compare-wrapper').forEach(wrapper => {
  const slider = wrapper.querySelector('.slider');
  const afterImg = wrapper.querySelector('.after-img');

  slider.addEventListener('mousedown', startDrag);
  slider.addEventListener('touchstart', startDrag);

  function startDrag(e) {
    e.preventDefault();
    window.addEventListener('mousemove', drag);
    window.addEventListener('touchmove', drag, { passive:false });
    window.addEventListener('mouseup', stopDrag);
    window.addEventListener('touchend', stopDrag);
  }

  function drag(e) {
    e.preventDefault();
    let x = e.pageX || e.touches[0].pageX;
    let rect = wrapper.getBoundingClientRect();
    let pos = Math.max(0, Math.min(x - rect.left, rect.width));
    slider.style.left = pos + 'px';
    afterImg.style.width = pos + 'px';
  }

  function stopDrag() {
    window.removeEventListener('mousemove', drag);
    window.removeEventListener('touchmove', drag);
    window.removeEventListener('mouseup', stopDrag);
    window.removeEventListener('touchend', stopDrag);
  }
});
</script>

</body>
</html>
